[workspace]
members = [
    "crates/typora-app",
    "crates/typora-core",
    "crates/typora-md",
    "crates/typora-platform",
    "crates/typora-render",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["typora-rust contributors"]
repository = "https://example.invalid/typora-rust"

[workspace.dependencies]
anyhow = "1"
comrak = "0.48"
criterion = "0.7"
floem = "0.2"
notify = "8"
parley = "0.5"
rfd = "0.15"
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
taffy = "0.8"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tree-sitter = "0.19"
tree-sitter-markdown = "0.7"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
